name: CI/CD — Backend

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew clean test --no-daemon

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          CI=true npm test -- --watchAll=false --runInBand WebSocketContext.test.js
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify deployment contracts
        run: |
          bash -n backend/infra/deploy.sh
          bash backend/infra/tests/compose_contract_test.sh
          bash backend/infra/tests/deploy_test.sh
          bash backend/infra/tests/workflow_contract_test.sh

      - name: Verify backend image build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: devchat-backend:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags
        id: tags
        shell: bash
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          IMAGE="ghcr.io/lunarbae628/devchat-backend:dev-$SHORT_SHA"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/lunarbae628/devchat-backend:dev"
            echo "$IMAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: devchat-homeserver
      cancel-in-progress: false
    env:
      HOME_SERVER_HOST: ${{ secrets.HOME_SERVER_HOST }}
      HOME_SERVER_PORT: ${{ secrets.HOME_SERVER_PORT }}
      HOME_SERVER_USER: ${{ secrets.HOME_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HOME_SERVER_SSH_KEY: ${{ secrets.HOME_SERVER_SSH_KEY }}
          HOME_SERVER_KNOWN_HOSTS: ${{ secrets.HOME_SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HOME_SERVER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOME_SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Check home server prerequisites
        run: |
          ssh -p "$HOME_SERVER_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$HOME_SERVER_USER@$HOME_SERVER_HOST" \
            'test -d /srv/devchat &&
             test -f /srv/devchat/.env &&
             test -f /srv/gateway/nginx/conf.d/devchat-upstream.conf'

      - name: Copy deployment files
        run: |
          scp -P "$HOME_SERVER_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            backend/infra/docker-compose.yml \
            "$HOME_SERVER_USER@$HOME_SERVER_HOST:/srv/devchat/docker-compose.yml.incoming-$GITHUB_SHA"
          scp -P "$HOME_SERVER_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            backend/infra/deploy.sh \
            "$HOME_SERVER_USER@$HOME_SERVER_HOST:/srv/devchat/deploy.sh.incoming-$GITHUB_SHA"

      - name: Log in home server to GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh -p "$HOME_SERVER_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              "$HOME_SERVER_USER@$HOME_SERVER_HOST" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy immutable image
        env:
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          ssh -p "$HOME_SERVER_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$HOME_SERVER_USER@$HOME_SERVER_HOST" \
            bash -s -- "$GITHUB_SHA" "$DEPLOY_IMAGE" <<'REMOTE'
          set -Eeuo pipefail
          release_id=$1
          image=$2
          exec 9>/srv/devchat/deploy.lock
          flock -w 600 9
          mv "/srv/devchat/docker-compose.yml.incoming-$release_id" /srv/devchat/docker-compose.yml
          mv "/srv/devchat/deploy.sh.incoming-$release_id" /srv/devchat/deploy.sh
          chmod +x /srv/devchat/deploy.sh
          DEPLOY_LOCK_HELD=true /srv/devchat/deploy.sh "$image"
          REMOTE
